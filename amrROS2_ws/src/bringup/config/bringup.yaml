ekf_filter_node:
    ros__parameters:
            # frequency: 20.0
            #frequency: 50.0
            frequency: 40.0
            two_d_mode: true
            publish_tf: true
    
            map_frame: map             
            odom_frame: odom            
            base_link_frame: base_footprint
            world_frame: odom 

            #x     , y     , z,
            #roll  , pitch , yaw,
            #vx    , vy    , vz,
            #vroll , vpitch, vyaw,
            #ax    , ay    , az
            odom0: odom_raw
            odom0_config: [false, false, false,
                        false, false, false,
                        true, true, false,
                        false, false, true,
                        false, false, false]

            imu0: imu/data_raw
            imu0_config: [false, false, false,
                        false, false, true,
                        false, false, false,
                        false, false, true,
                        false, false, false]

imu_filter:
    ros__parameters:
        stateless: false
        use_mag: false
        publish_tf: false
        reverse_tf: false
        fixed_frame: "odom"
        constant_dt: 0.0
        publish_debug_topics: false
        world_frame: "enu"
        gain: 0.1
        zeta: 0.0
        mag_bias_x: 0.0
        mag_bias_y: 0.0
        mag_bias_z: 0.0
        orientation_stddev: 0.0

usb_camera:
    ros__parameters:
      video_device: "/dev/video0"
      framerate: 30.0
      io_method: "mmap"
      frame_id: "rgbd_frame"
      pixel_format: "yuyv2rgb"
      image_width: 640
      image_height: 360
      camera_name: "test_camera"
      camera_info_url: "file:///home/smr/workspaces/mini_amr/amrROS2_ws/src/bringup/config/camera_info_360p.yaml"

#60degree laser scan filter chain
scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: box_filter
      type: laser_filters/LaserScanBoxFilter
      params: #[0.24, 0.22], [-0.24, 0.22], [-0.24, -0.22], [0.24, -0.22]
        box_frame: laser
        min_x: -0.27
        max_x: 0.27
        min_y: -0.27
        max_y: 0.27
        min_z: -0.1
        max_z: 0.1
    filter2:
      name: front_right_angle 
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: 1.8314 #2.25
        upper_angle: 2.46
        #lsmgop:

    filter3:
        name: speckle_filter
        type: laser_filters/LaserScanSpeckleFilter
        params:
          filter_type: 0
          max_range: 2.0
          max_range_difference: 0.1
          filter_window: 7
