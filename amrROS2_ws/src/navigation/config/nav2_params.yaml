collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "center_footprint" #"center_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_smoothed" 
    cmd_vel_out_topic: "/cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0 #1.0
    source_timeout: 5.0 #5.0
    base_shift_correction: True
    stop_pub_timeout: 1.0
    # Polygons represent zone around the robot for "stop" and "slowdown" action types,
    # and robot footprint for "approach" action type.
    # Footprint could be "polygon" type with dynamically set footprint from footprint_topic
    # or "circle" type with static footprint set by radius. "footprint_topic" parameter
    # to be ignored in circular case.
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]
    # #polygons: ["PolygonStop"]
    # PolygonStop:
    #   type: "polygon"
    #   points: "[[0.32, 0.25], [0.32, -0.25], [-0.32, -0.25], [-0.32, 0.25]]"
    #   action_type: "stop"
    #   #max_points: 4
    #   visualize: True
    #   polygon_pub_topic: "/polygon_stop"
    #   enabled: true
    PolygonStop:
      type: "polygon"
      points: "[[0.26, 0.24], [-0.26, 0.24], [-0.26, -0.24], [0.26, -0.24]]"
      action_type: "stop"
      min_points: 4  # max_points: 3 for Humble
      visualize: False
      polygon_pub_topic: "/polygon_stop"
      enabled: True
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.05
      min_points: 6  # max_points: 5 for Humble
      visualize: False #False
      enabled: True
    PolygonSlow:
      type: "polygon"
      #points: "[[0.35, 0.2], [0.35, -0.2], [0.0, -0.2], [0.0, 0.2]]"
      points: "[[0.35, 0.2], [0.35, -0.2], [0.0, -0.2], [0.0, 0.2]]"
      action_type: "slowdown"
      #max_points: 4
      slowdown_ratio: 0.5
      visualize: False
      polygon_pub_topic: "/polygon_slowdown"
      enabled: True
    #observation_sources: ["range_center", "range_left", "range_right", "scan"]
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      enabled: True
    # pointcloud:
    #   type: "pointcloud"
    #   topic: "/intel_realsense_r200_depth/points"
    #   min_height: 0.1
    #   max_height: 0.5
    range_left:
      type: "range"
      topic: "/range/left"
      enabled: true
    range_center:
      type: "range"
      topic: "/range/center"
      enabled: true
    range_right:
      type: "range"
      topic: "/range/right"
      enabled: true

collision_detector:
  ros__parameters:
    base_frame_id: "center_footprint"
    odom_frame_id: "odom"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    polygons: ["PolygonStop", "PolygonSlow"]
    #polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: "[[0.26, 0.24], [-0.26, 0.24], [-0.26, -0.24], [0.26, -0.24]]"
      action_type: "none"
      #max_points: 4
      visualize: True
      polygon_pub_topic: "/polygon_stop_detector"
      enabled: true
    PolygonSlow:
      type: "polygon"
      points: "[[0.4, 0.2], [0.4, -0.2], [0.0, -0.2], [0.0, 0.2]]"
      action_type: "none"
      #max_points: 4
      slowdown_ratio: 0.5
      visualize: True
      polygon_pub_topic: "/polygon_slowdown_detector"
      enabled: True
    #observation_sources: ["range_center", "range_left", "range_right", "scan"]
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      enabled: True
    # pointcloud:
    #   type: "pointcloud"
    #   topic: "/intel_realsense_r200_depth/points"
    #   min_height: 0.1
    #   max_height: 0.5
    range_left:
      type: "range"
      topic: "/range/left"
      enabled: true
    range_center:
      type: "range"
      topic: "/range/center"
      enabled: true
    range_right:
      type: "range"
      topic: "/range/right"
      enabled: true

