keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: "/keepout_costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    # yaml_filename: "/home/smr/workspaces/mini_amr/amrROS2_ws/maps/NECTEC_4th_Floor_keepout.yaml" # need to edit for filter
    # yaml_filename: "/home/smr/workspaces/mini_amr/amrROS2_ws/maps/NECTEC_4th_Floor_SLAM_keepout.yaml" # For SLAM map with keepout areas


amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "center_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true #false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.9 #0.5
    z_max: 0.05
    z_rand: 0.1 #0.5
    z_short: 0.05
    scan_topic: scan_filtered
    set_initial_pose: true
    initial_pose: #currently set to NECTEC 4th floor (room 410)
      x: 0.0 #1.428
      y: 0.0 #-4.288
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: center_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 5000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    default_nav_to_pose_bt_xml: /home/smr/workspaces/mini_amr/Shortcut/navigate_to_pose_w_replanning_and_recovery.xml # or $(find-pkg-share my_package)/behavior_tree/my_nav_to_pose_bt.xml
    #default_nav_through_poses_bt_xml: /home/smr/workspaces/mini_amr/Shortcut/navigate_through_pose_noreplan.xml
    default_nav_through_poses_bt_xml: /home/smr/workspaces/mini_amr/Shortcut/navigate_through_pose.xml 
    #default_nav_through_poses_bt_xml: /home/smr/workspaces/mini_amr/Shortcut/navigate_through_pose_r2.xml
    
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator" # In Iron and older versions, "/" was used instead of "::"
      enable_groot_monitoring: false
      groot_server_port: 1667
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator" # In Iron and older versions, "/" was used instead of "::"
      enable_groot_monitoring: false
      groot_server_port: 1669
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # behavior_plugins: ["spin", "backup", "wait"]
    behavior_plugins: ["wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    # drive_on_heading:
    #   plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: center_footprint
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 2.0 #0.3 #0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 8.0

    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3

    # goal_checker:
    #   plugin: "nav2_controller::PositionGoalChecker"
    #   xy_goal_tolerance: 0.5
    #   stateful: True

    
    # FollowPath:
    #   plugin: "nav2_rotation_shim_controller::RotationShimController"
    #   primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    #   angular_dist_threshold: 0.785
    #   forward_sampling_distance: 0.5
    #   angular_disengage_threshold: 0.3925
    #   rotate_to_heading_angular_vel: 0.8
    #   max_angular_accel: 0.8
    #   simulate_ahead_time: 1.0
    #   rotate_to_goal_heading: true

    # FollowPath:
    #   plugin: nav2_graceful_controller::GracefulController
    #   transform_tolerance: 0.1
    #   min_lookahead: 1.0
    #   max_lookahead: 3.5
    #   initial_rotation: true
    #   initial_rotation_threshold: 0.75
    #   prefer_final_rotation: true
    #   allow_backward: true
    #   k_phi: 1.0
    #   k_delta: 0.25
    #   beta: 0.3
    #   lambda: 0.1
    #   v_linear_min: 0.1
    #   v_linear_max: 1.0
    #   v_angular_max: 0.3
    #   v_angular_min_in_place: 0.4
    #   slowdown_radius: 2.0

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30 #56
      model_dt: 0.1
      batch_size: 400 #400
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.4 #1.0 #1.5
      vx_min: -0.3
      vy_max: 0.5
      wz_max: 1.5
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 3.0 #2.0
        consider_footprint: true
      AckermannConstraints:
        min_turning_r: 0.0 # 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0 #5.0
        threshold_to_consider: 0.5
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
