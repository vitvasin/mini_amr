slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: ITERATIVE_SCHUR
    ceres_preconditioner: JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: scan
    mode: localization
    map_file_name: /home/smr/maps/test03
    # map_start_pose: [0.0, 0.0, 0.0] 
    map_start_pose: [5.65,0.993,0.235]

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.1        # was 0.02 → reduced TF overhead
    map_update_interval: 5.0
    resolution: 0.05
    min_laser_range: 0.0
    max_laser_range: 10.0
    minimum_time_interval: 1.0           # was 0.5 → limit updates to ~1 Hz
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5         # was 0.5
    minimum_travel_heading: 0.5        # was 0.5
    scan_buffer_size: 3                  # was 3
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: false 

    # Correlation parameters
    correlation_search_space_dimension: 0.3   # was 0.5
    correlation_search_space_resolution: 0.03 # was 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Loop closure irrelevant since disabled
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0

    distance_variance_penalty: 0.1
    angle_variance_penalty: 0.5
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349        # was 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true